name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run Lint
              run: npm run lint:check

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run Build
              run: npm run build
            - name: Upload build result
              uses: actions/upload-artifact@v4
              with:
                  name: build-result
                  path: .scaffold/build

    test:
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
            - name: Install dependencies
              run: npm ci
            - name: Run Unit Tests
              run: npm run test:unit
            - name: Run Integration Tests
              run: npm run test -- --no-watch
